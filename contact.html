<section class="info-box">
    <h2>Contact Shelfie</h2>

    <p>Have a question or need assistance? Send us a message.</p>

   <form action="https://formsubmit.co/nemaguvhunilusani2@gmail.com"
      method="POST" id="contactForm">

        <label for="contactName">Full Name:</label>
        <input type="text" id="contactName" name="contactName"
               minlength="2" required>

        <label for="contactEmail">Email Address:</label>
        <input type="email" id="contactEmail" name="nemaguvhunilusani2@gmail.com"
       required>

        <label for="messageType">Message Type:</label>
        <select id="messageType" name="messageType" required>
            <option value="">Choose a message type</option>
            <option value="General Enquiry">General Enquiry</option>
            <option value="Book Order">Book Order</option>
            <option value="Book Availability">Book Availability</option>
            <option value="Feedback">Feedback</option>
            <option value="Complaint">Complaint</option>
        </select>

        <label for="contactMessage">Your Message:</label>
        <textarea id="contactMessage" name="message"
          rows="5" minlength="10" maxlength="1000"
          required></textarea>

        <button type="submit">Send Email</button>
        <button type="reset">Clear Form</button>
    </form>

    <p id="contactResponse" role="status"></p>
</section>
